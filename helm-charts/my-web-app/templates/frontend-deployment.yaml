apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.image.tag }}
          ports:
              - containerPort: {{ .Values.frontend.service.port }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}

      volumes:
        - name: config-volume
          configMap:
            name: {{ .Release.Name }}-frontend-config
