---
- name: Update apt and install dependencies
  become: yes
  apt:
    update_cache: yes
    name:
      - python3
      - python3-venv
      - python3-pip
      - git
      - nginx
    state: present

- name: Create application user
  user:
    name: "{{ app_user }}"
    system: yes
    create_home: yes
    shell: /bin/bash
  become: yes

- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  become: yes
